name: QA smoke tests

on:
  pull_request:            # quality gate on every PR (QA Test Strategy 11.1)
  push:
    branches: [main]
  schedule:
    - cron: '0 11 * * *'   # daily, 11:00 UTC
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Store URL to test'
        default: 'https://www.smokecartel.com'

concurrency:
  group: qa-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_URL: ${{ github.event.inputs.site_url || 'https://www.smokecartel.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run smoke tests
        run: npx playwright test --grep @smoke
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Email on failure (Resend)
        if: failure() && github.event_name != 'pull_request'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM: ${{ secrets.QA_ALERT_FROM }}       # e.g. High Tide QA <qa@your-verified-domain>
          ALERT_TO: ${{ secrets.QA_ALERT_EMAILS }}       # comma-separated
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n --arg from "$ALERT_FROM" --arg to "$ALERT_TO" \
                --arg subject "QA smoke tests FAILED - $SITE_URL" \
                --arg text "Smoke tests failed for $SITE_URL. Report: $RUN_URL" \
                '{from: $from, to: ($to | split(",") | map(gsub("^\\s+|\\s+$"; ""))), subject: $subject, text: $text}' \
          | curl -sS --fail-with-body https://api.resend.com/emails \
              -H "Authorization: Bearer $RESEND_API_KEY" \
              -H "Content-Type: application/json" \
              -d @-
